<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ultra Auth X</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="background"></div>

    <div class="wave">
        <svg viewBox="0 0 1440 320">
            <path fill="white" fill-opacity="0.15"
                d="M0,96L60,112C120,128,240,160,360,165.3C480,171,600,149,720,144C840,139,960,149,1080,176C1200,203,1320,245,1380,266.7L1440,288L1440,320L0,320Z">
            </path>
        </svg>
    </div>

    <canvas id="particles"></canvas>

    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </div>

    <div class="toast-container"></div>

    <div class="container">

        <div class="auth-card">

            <div class="logo">
                <h1>UltraAuth X</h1>
                <p>Next Generation Authentication</p>
            </div>

            <!-- LOGIN -->

            <div class="form-view active" id="loginView">

                <form id="loginForm">

                    <div class="input-group">

                        <label>Email</label>

                        <input type="email" id="loginEmail" placeholder="you@example.com">

                        <i class="fas fa-check validation-icon"></i>

                    </div>

                    <div class="input-group">

                        <label>Password</label>

                        <input type="password" id="loginPassword" placeholder="••••••••">

                        <i class="fas fa-eye password-toggle">
                        </i>

                    </div>

                    <div class="form-options">

                        <label>
                            <input type="checkbox" id="rememberMe">
                            Remember Me
                        </label>

                        <a href="#" id="forgotLink">
                            Forgot Password?
                        </a>

                    </div>

                    <button class="btn">
                        🚀 Login
                    </button>

                </form>

                <div class="social-section">

                    <div class="social-title">
                        Or continue with
                    </div>

                    <div class="social-grid">

                        <button class="social-btn" data-provider="Google">
                            <i class="fab fa-google"></i>
                            Google
                        </button>

                        <button class="social-btn" data-provider="GitHub">
                            <i class="fab fa-github"></i>
                            GitHub
                        </button>

                        <button class="social-btn" data-provider="Facebook">
                            <i class="fab fa-facebook"></i>
                            Facebook
                        </button>

                        <button class="social-btn" data-provider="Apple">
                            <i class="fab fa-apple"></i>
                            Apple
                        </button>

                    </div>

                </div>

            </div>

            <!-- REGISTER -->

            <div class="form-view" id="registerView">

                <form id="registerForm">

                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="regUsername">
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="regEmail">
                    </div>

                    <div class="input-group">

                        <label>Password</label>

                        <input type="password" id="regPassword">

                        <i class="fas fa-eye password-toggle"></i>

                    </div>

                    <div class="strength-wrapper">

                        <div class="strength-bar">
                            <div class="strength-fill"></div>
                        </div>

                        <div class="strength-text">
                            Password Strength
                        </div>

                    </div>

                    <div class="input-group">

                        <label>Confirm Password</label>

                        <input type="password" id="confirmPassword">

                        <i class="fas fa-eye password-toggle"></i>

                    </div>

                    <button class="btn">
                        ✨ Create Account
                    </button>

                </form>

            </div>

            <!-- EMAIL VERIFY -->

            <div class="form-view" id="verifyView">

                <form id="verifyForm">

                    <div class="input-group">
                        <label>Verification Code</label>
                        <input type="text" maxlength="4" id="verifyCode">
                    </div>

                    <button class="btn">
                        🎉 Verify Email
                    </button>

                </form>

            </div>

            <!-- FORGOT PASSWORD -->

            <div class="form-view" id="forgotView">

                <form id="forgotForm">

                    <div class="input-group">

                        <label>Email Address</label>

                        <input type="email" id="forgotEmail">

                    </div>

                    <button class="btn">
                        📩 Send Reset Code
                    </button>

                </form>

            </div>

            <!-- RESET CODE -->

            <div class="form-view" id="resetCodeView">

                <form id="resetCodeForm">

                    <div class="input-group">
                        <label>Reset Code</label>
                        <input type="text" maxlength="4" id="resetCode">
                    </div>

                    <button class="btn">
                        🔐 Verify Code
                    </button>

                </form>

            </div>

            <!-- NEW PASSWORD -->

            <div class="form-view" id="newPasswordView">

                <form id="newPasswordForm">

                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword">
                    </div>

                    <button class="btn">
                        ✅ Update Password
                    </button>

                </form>

            </div>

            <!-- DASHBOARD -->

            <div class="dashboard" id="dashboard">

                <div class="profile-header">

                    <div class="avatar">
                        👑
                    </div>

                    <div>

                        <h2 id="dashboardName">
                            Welcome
                        </h2>

                        <p id="dashboardEmail">
                            user@email.com
                        </p>

                    </div>

                </div>

                <div class="stats-grid">

                    <div class="stat-card">
                        <h3>365</h3>
                        <p>Days Active</p>
                    </div>

                    <div class="stat-card">
                        <h3>42</h3>
                        <p>Logins</p>
                    </div>

                    <div class="stat-card">
                        <h3>99%</h3>
                        <p>Security</p>
                    </div>

                </div>

                <div class="badges">

                    <div class="badge success">
                        ✓ Verified
                    </div>

                    <div class="badge warning">
                        2FA Off
                    </div>

                    <div class="badge info">
                        Alerts On
                    </div>

                </div>

                <div class="security-panel">

                    <h3>
                        🛡 Account Security
                    </h3>

                    <br>

                    <p>Password Strength: Strong</p>
                    <p>Last Login: Today</p>
                    <p>Active Sessions: 3</p>

                </div>

                <div class="quick-actions">

                    <button class="action-btn">
                        🔒 Change Password
                    </button>

                    <button class="action-btn">
                        📱 Setup 2FA
                    </button>

                    <button class="action-btn">
                        📜 Login History
                    </button>

                    <button class="action-btn" id="logoutBtn">
                        🚪 Logout
                    </button>

                </div>

            </div>

        </div>

    </div>
    
<script src="js/app.js"></script>
    
</body>

</html>
