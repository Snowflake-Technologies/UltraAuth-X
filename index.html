<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ultra Auth X</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* =====================================================
   ROOT VARIABLES
===================================================== */

        :root {

            --primary: #7c3aed;
            --secondary: #3b82f6;
            --accent: #ec4899;

            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;

            --bg: #f8fafc;
            --card: rgba(255, 255, 255, .25);

            --text: #0f172a;
            --text-light: #64748b;

            --glass-border: rgba(255, 255, 255, .2);

            --shadow:
                0 8px 32px rgba(31, 38, 135, .15);

            --gradient:
                linear-gradient(135deg,
                    #7c3aed,
                    #3b82f6,
                    #ec4899);

        }

        /* DARK MODE */

        body.dark {

            --bg: #050816;

            --card: rgba(15, 23, 42, .55);

            --text: #f8fafc;

            --text-light: #94a3b8;

            --glass-border: rgba(255, 255, 255, .08);

            --gradient:
                linear-gradient(135deg,
                    #0f172a,
                    #312e81,
                    #7c3aed,
                    #ec4899);

        }

        /* =====================================================
RESET
===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                Segoe UI,
                sans-serif;

            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
            transition: .4s ease;
            color: var(--text);
        }

        /* =====================================================
ANIMATED BACKGROUND
===================================================== */

        .background {

            position: fixed;
            inset: 0;

            background: var(--gradient);
            background-size: 400% 400%;

            animation:
                gradientMove 18s ease infinite;

            z-index: -3;

        }

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }

        /* =====================================================
WAVE
===================================================== */

        .wave {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: -2;
            opacity: .4;
        }

        .wave svg {
            width: 100%;
            height: 220px;
            animation: waveFloat 8s ease-in-out infinite;
        }

        @keyframes waveFloat {
            50% {
                transform: translateY(-15px);
            }
        }

        /* =====================================================
PARTICLES
===================================================== */

        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* =====================================================
THEME TOGGLE
===================================================== */

        .theme-toggle {

            position: fixed;
            top: 20px;
            right: 20px;

            width: 60px;
            height: 60px;

            border-radius: 50%;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            backdrop-filter: blur(25px);

            background: var(--card);

            border: 1px solid var(--glass-border);

            color: var(--text);

            box-shadow: var(--shadow);

            transition: .4s;

            z-index: 1000;
        }

        .theme-toggle:hover {

            transform:
                scale(1.1) rotate(15deg);

        }

        /* =====================================================
MAIN WRAPPER
===================================================== */

        .container {

            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* =====================================================
GLASS CARD
===================================================== */

        .auth-card {

            width: 100%;
            max-width: 480px;

            background: var(--card);

            backdrop-filter: blur(30px);

            border: 1px solid var(--glass-border);

            border-radius: 32px;

            padding: 35px;

            box-shadow: var(--shadow);

            animation:
                cardAppear .8s ease;

            position: relative;

            overflow: hidden;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform:
                    translateY(30px) scale(.95);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0) scale(1);
            }

        }

        /* =====================================================
LOGO
===================================================== */

        .logo {

            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {

            font-size: 2rem;

            background: linear-gradient(90deg,
                    #fff,
                    #f0abfc,
                    #93c5fd);

            -background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo p {
            margin-top: 8px;
            color: var(--text-light);
        }

        /* =====================================================
FORMS
===================================================== */

        .form-view {
            display: none;
            animation: fadeSlide .45s ease;
        }

        .form-view.active {
            display: block;
        }

        @keyframes fadeSlide {

            from {
                opacity: 0;
                transform: translateX(25px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

        .input-group {

            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {

            display: block;
            margin-bottom: 8px;

            font-weight: 600;
        }

        .input-group input {

            width: 100%;
            padding: 15px 18px;

            border: none;
            outline: none;

            border-radius: 14px;

            background:
                rgba(255, 255, 255, .12);

            backdrop-filter: blur(20px);

            color: var(--text);

            font-size: 15px;

            transition: .3s;
        }

        .input-group input:focus {

            box-shadow:
                0 0 0 3px rgba(124, 58, 237, .3);

            transform: translateY(-2px);
        }

        .validation-icon {

            position: absolute;
            right: 16px;
            top: 48px;

            color: var(--success);

            opacity: 0;
            transition: .3s;
        }

        /* =====================================================
PASSWORD TOGGLE
===================================================== */

        .password-toggle {

            position: absolute;
            right: 16px;
            top: 48px;

            cursor: pointer;
            transition: .3s;
        }

        .password-toggle:hover {
            transform: scale(1.15);
        }

        /* =====================================================
BUTTONS
===================================================== */

        .btn {

            width: 100%;

            padding: 15px;

            border: none;
            cursor: pointer;

            border-radius: 14px;

            font-size: 15px;
            font-weight: 700;

            color: white;

            background:
                linear-gradient(135deg,
                    var(--primary),
                    var(--secondary));

            transition: .3s;

            position: relative;
            overflow: hidden;
        }

        .btn:hover {

            transform:
                translateY(-3px) scale(1.02);

            box-shadow:
                0 10px 25px rgba(124, 58, 237, .35);
        }

        .btn:active {
            transform: scale(.98);
        }

        /* =====================================================
REMEMBER
===================================================== */

        .form-options {

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 15px 0;
            font-size: 14px;
        }

        .form-options a {

            text-decoration: none;
            color: #60a5fa;
        }

        /* =====================================================
SOCIAL LOGIN
===================================================== */

        .social-section {
            margin-top: 25px;
        }

        .social-title {

            text-align: center;
            margin-bottom: 18px;

            color: var(--text-light);
        }

        .social-grid {

            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;
        }

        .social-btn {

            padding: 14px;

            border: none;
            cursor: pointer;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            background: rgba(255, 255, 255, .08);

            color: var(--text);

            backdrop-filter: blur(20px);

            transition: .3s;
        }

        .social-btn:hover {

            transform:
                translateY(-4px) scale(1.04);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, .15);
        }

        .social-btn i {
            font-size: 1.2rem;
        }

        /* =====================================================
PASSWORD STRENGTH
===================================================== */

        .strength-wrapper {
            margin-top: 10px;
        }

        .strength-bar {

            height: 8px;
            border-radius: 999px;

            overflow: hidden;

            background: rgba(255, 255, 255, .15);
        }

        .strength-fill {

            height: 100%;
            width: 0%;

            transition: .4s;
        }

        .strength-text {
            margin-top: 8px;
            font-size: 13px;
        }

        /* =====================================================
TOAST
===================================================== */

        .toast-container {

            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 9999;
        }

        .toast {

            background: #111827;
            color: white;

            padding: 15px 22px;

            border-radius: 14px;

            margin-top: 10px;

            animation:
                toastIn .4s ease;
        }

        @keyframes toastIn {

            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =====================================================
PROFILE DASHBOARD
===================================================== */

        .dashboard {
            display: none;
            animation: fadeSlide .5s ease;
        }

        .dashboard.active {
            display: block;
        }

        .profile-header {

            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 25px;
        }

        .avatar {

            width: 80px;
            height: 80px;

            border-radius: 50%;

            background: var(--gradient);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 2rem;
            color: white;
        }

        .stats-grid {

            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {

            padding: 18px;

            border-radius: 20px;

            background: rgba(255, 255, 255, .08);

            text-align: center;
        }

        .badges {

            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .badge {

            padding: 8px 12px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 700;
        }

        .badge.success {
            background: rgba(34, 197, 94, .15);
            color: #22c55e;
        }

        .badge.warning {
            background: rgba(245, 158, 11, .15);
            color: #f59e0b;
        }

        .badge.info {
            background: rgba(59, 130, 246, .15);
            color: #3b82f6;
        }

        /* =====================================================
QUICK ACTIONS
===================================================== */

        .quick-actions {

            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-top: 25px;
        }

        .action-btn {

            padding: 14px;

            border: none;

            cursor: pointer;

            border-radius: 14px;

            background: rgba(255, 255, 255, .08);

            color: var(--text);

            transition: .3s;
        }

        .action-btn:hover {
            transform: translateY(-3px);
        }

        /* =====================================================
SECURITY PANEL
===================================================== */

        .security-panel {

            margin-top: 25px;

            padding: 20px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, .08);
        }

        /* =====================================================
SKELETON
===================================================== */

        .skeleton {

            height: 18px;
            border-radius: 999px;

            background:
                linear-gradient(90deg,
                    rgba(255, 255, 255, .05),
                    rgba(255, 255, 255, .2),
                    rgba(255, 255, 255, .05));

            background-size: 300%;

            animation: skeleton 1.5s infinite;
        }

        @keyframes skeleton {

            0% {
                background-position: 100%;
            }

            100% {
                background-position: -100%;
            }

        }

        /* =====================================================
CONFETTI
===================================================== */

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
        }

        /* =====================================================
RESPONSIVE
===================================================== */

        @media(max-width:768px) {

            .auth-card {
                padding: 24px;
            }

            .social-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="wave">
        <svg viewBox="0 0 1440 320">
            <path fill="white" fill-opacity="0.15"
                d="M0,96L60,112C120,128,240,160,360,165.3C480,171,600,149,720,144C840,139,960,149,1080,176C1200,203,1320,245,1380,266.7L1440,288L1440,320L0,320Z">
            </path>
        </svg>
    </div>

    <canvas id="particles"></canvas>

    <div class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </div>

    <div class="toast-container"></div>

    <div class="container">

        <div class="auth-card">

            <div class="logo">
                <h1>UltraAuth X</h1>
                <p>Next Generation Authentication</p>
            </div>

            <!-- LOGIN -->

            <div class="form-view active" id="loginView">

                <form id="loginForm">

                    <div class="input-group">

                        <label>Email</label>

                        <input type="email" id="loginEmail" placeholder="you@example.com">

                        <i class="fas fa-check validation-icon"></i>

                    </div>

                    <div class="input-group">

                        <label>Password</label>

                        <input type="password" id="loginPassword" placeholder="••••••••">

                        <i class="fas fa-eye password-toggle">
                        </i>

                    </div>

                    <div class="form-options">

                        <label>
                            <input type="checkbox" id="rememberMe">
                            Remember Me
                        </label>

                        <a href="#" id="forgotLink">
                            Forgot Password?
                        </a>

                    </div>

                    <button class="btn">
                        🚀 Login
                    </button>

                </form>

                <div class="social-section">

                    <div class="social-title">
                        Or continue with
                    </div>

                    <div class="social-grid">

                        <button class="social-btn" data-provider="Google">
                            <i class="fab fa-google"></i>
                            Google
                        </button>

                        <button class="social-btn" data-provider="GitHub">
                            <i class="fab fa-github"></i>
                            GitHub
                        </button>

                        <button class="social-btn" data-provider="Facebook">
                            <i class="fab fa-facebook"></i>
                            Facebook
                        </button>

                        <button class="social-btn" data-provider="Apple">
                            <i class="fab fa-apple"></i>
                            Apple
                        </button>

                    </div>

                </div>

            </div>

            <!-- REGISTER -->

            <div class="form-view" id="registerView">

                <form id="registerForm">

                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="regUsername">
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="regEmail">
                    </div>

                    <div class="input-group">

                        <label>Password</label>

                        <input type="password" id="regPassword">

                        <i class="fas fa-eye password-toggle"></i>

                    </div>

                    <div class="strength-wrapper">

                        <div class="strength-bar">
                            <div class="strength-fill"></div>
                        </div>

                        <div class="strength-text">
                            Password Strength
                        </div>

                    </div>

                    <div class="input-group">

                        <label>Confirm Password</label>

                        <input type="password" id="confirmPassword">

                        <i class="fas fa-eye password-toggle"></i>

                    </div>

                    <button class="btn">
                        ✨ Create Account
                    </button>

                </form>

            </div>

            <!-- EMAIL VERIFY -->

            <div class="form-view" id="verifyView">

                <form id="verifyForm">

                    <div class="input-group">
                        <label>Verification Code</label>
                        <input type="text" maxlength="4" id="verifyCode">
                    </div>

                    <button class="btn">
                        🎉 Verify Email
                    </button>

                </form>

            </div>

            <!-- FORGOT PASSWORD -->

            <div class="form-view" id="forgotView">

                <form id="forgotForm">

                    <div class="input-group">

                        <label>Email Address</label>

                        <input type="email" id="forgotEmail">

                    </div>

                    <button class="btn">
                        📩 Send Reset Code
                    </button>

                </form>

            </div>

            <!-- RESET CODE -->

            <div class="form-view" id="resetCodeView">

                <form id="resetCodeForm">

                    <div class="input-group">
                        <label>Reset Code</label>
                        <input type="text" maxlength="4" id="resetCode">
                    </div>

                    <button class="btn">
                        🔐 Verify Code
                    </button>

                </form>

            </div>

            <!-- NEW PASSWORD -->

            <div class="form-view" id="newPasswordView">

                <form id="newPasswordForm">

                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword">
                    </div>

                    <button class="btn">
                        ✅ Update Password
                    </button>

                </form>

            </div>

            <!-- DASHBOARD -->

            <div class="dashboard" id="dashboard">

                <div class="profile-header">

                    <div class="avatar">
                        👑
                    </div>

                    <div>

                        <h2 id="dashboardName">
                            Welcome
                        </h2>

                        <p id="dashboardEmail">
                            user@email.com
                        </p>

                    </div>

                </div>

                <div class="stats-grid">

                    <div class="stat-card">
                        <h3>365</h3>
                        <p>Days Active</p>
                    </div>

                    <div class="stat-card">
                        <h3>42</h3>
                        <p>Logins</p>
                    </div>

                    <div class="stat-card">
                        <h3>99%</h3>
                        <p>Security</p>
                    </div>

                </div>

                <div class="badges">

                    <div class="badge success">
                        ✓ Verified
                    </div>

                    <div class="badge warning">
                        2FA Off
                    </div>

                    <div class="badge info">
                        Alerts On
                    </div>

                </div>

                <div class="security-panel">

                    <h3>
                        🛡 Account Security
                    </h3>

                    <br>

                    <p>Password Strength: Strong</p>
                    <p>Last Login: Today</p>
                    <p>Active Sessions: 3</p>

                </div>

                <div class="quick-actions">

                    <button class="action-btn">
                        🔒 Change Password
                    </button>

                    <button class="action-btn">
                        📱 Setup 2FA
                    </button>

                    <button class="action-btn">
                        📜 Login History
                    </button>

                    <button class="action-btn" id="logoutBtn">
                        🚪 Logout
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>
<script>

    /* ==========================================================
